name: Deploy

# Setelah CI lulus di main: (1) memicu webhook Komodo (Stack → deploy) dan memastikan aplikasi hidup,
# (2) bila deploy berhasil, membuat rilis otomatis: naik versi, commit "Rilis vX.Y.Z", tag, dan GitHub release.
# Jenis kenaikan dari label PR yang digabung: bawaan patch; `rilis:minor` / `rilis:major` menaikkan; `tanpa-rilis` melewati.
# Rahasia ada di GitHub (Settings → Secrets and variables → Actions), tidak di repo:
#   KOMODO_WEBHOOK_URL     URL penuh dari Stack → Config → Webhooks (…/listener/github/stack/<id>/deploy)
#   KOMODO_WEBHOOK_SECRET  sama dengan KOMODO_WEBHOOK_SECRET di konfigurasi Komodo Core
# Variabel (bukan rahasia):
#   APP_URL                alamat publik aplikasi, mis. https://guru.rahmatur.dev (untuk pemeriksaan sehat)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Satu deploy dalam satu waktu; deploy yang menunggu diganti yang terbaru, yang sedang jalan tidak dibatalkan.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via Komodo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Otomatis saat push ke main (setelah PR lolos CI); jalankan manual hanya dari main.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    env:
      KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
      KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
      APP_URL: ${{ vars.APP_URL }}
      SHA: ${{ github.sha }}
    steps:
      - name: Periksa rahasia tersedia
        run: |
          if [ -z "$KOMODO_WEBHOOK_URL" ] || [ -z "$KOMODO_WEBHOOK_SECRET" ]; then
            echo "::error::Rahasia KOMODO_WEBHOOK_URL dan KOMODO_WEBHOOK_SECRET belum diisi di GitHub."
            exit 1
          fi

      - name: Pastikan commit ini masih yang terbaru di main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terbaru=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$terbaru" != "$SHA" ]; then
            echo "Commit $SHA bukan yang terbaru ($terbaru); deploy untuk commit yang lebih baru akan menyusul."
            echo "lewati=1" >> "$GITHUB_ENV"
          fi

      - name: Panggil webhook Komodo
        if: env.lewati != '1'
        run: |
          # Komodo memvalidasi HMAC-SHA256 isi permintaan (X-Hub-Signature-256) dan mengambil cabang dari "ref".
          isi=$(printf '{"ref":"refs/heads/main","after":"%s"}' "$SHA")
          tanda=$(printf '%s' "$isi" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | sed 's/^.* //')
          kode=$(curl -sS -o /tmp/respons.txt -w '%{http_code}' --max-time 60 \
            -X POST "$KOMODO_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$tanda" \
            --data "$isi")
          echo "Komodo membalas HTTP $kode"
          cat /tmp/respons.txt; echo
          if [ "$kode" -lt 200 ] || [ "$kode" -ge 300 ]; then
            echo "::error::Webhook Komodo gagal (HTTP $kode)."
            exit 1
          fi

      - name: Tunggu aplikasi sehat
        if: env.lewati != '1' && env.APP_URL != ''
        run: |
          # Komodo membangun image lalu memulai ulang kontainer; /api/hidup tidak menyentuh Drive maupun basis data.
          sleep 30
          for i in $(seq 1 30); do
            kode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$APP_URL/api/hidup" || true)
            echo "Percobaan $i: HTTP $kode"
            if [ "$kode" = "200" ]; then echo "Aplikasi hidup."; exit 0; fi
            sleep 10
          done
          echo "::error::Aplikasi belum sehat setelah ±6 menit. Periksa Komodo → Stack → Log."
          exit 1

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Deploy"
            echo "- Commit: \`$SHA\`"
            echo "- Status: ${{ job.status }}"
            if [ "${lewati:-}" = "1" ]; then echo "- Dilewati: ada commit yang lebih baru di main."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  rilis:
    name: Rilis otomatis
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hanya untuk deploy otomatis dari push ke main yang berhasil; run manual hanya mendeploy ulang.
    if: >-
      needs.deploy.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lewati bila commit ini bukan yang terbaru di main
        run: |
          terbaru=$(git rev-parse HEAD)
          if [ "$terbaru" != "$SHA" ]; then
            echo "main sudah maju ($terbaru), rilis untuk $SHA dilewati; commit terbaru akan dirilis oleh run-nya sendiri."
            echo "lewati=1" >> "$GITHUB_ENV"
          fi

      - name: Tentukan versi dari label PR
        if: env.lewati != '1'
        id: versi
        run: |
          pesan=$(git log -1 --format=%s "$SHA")
          lama=$(node -p "require('./package.json').version")
          # PR yang memuat commit ini (merge commit atau squash)
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[].labels[].name' 2>/dev/null || true)
          args=(--versi "$lama" --pesan "$pesan")
          while IFS= read -r l; do [ -n "$l" ] && args+=(--label "$l"); done <<< "$labels"
          node scripts/rilis.mjs "${args[@]}" | tee /tmp/keputusan.txt
          cat /tmp/keputusan.txt >> "$GITHUB_OUTPUT"
          echo "lama=$lama" >> "$GITHUB_OUTPUT"

      - name: Pastikan tag belum ada
        if: env.lewati != '1' && steps.versi.outputs.jenis != 'lewati'
        run: |
          if git rev-parse "v${{ steps.versi.outputs.baru }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.versi.outputs.baru }} sudah ada."
            exit 1
          fi

      - name: Commit, tag, dan dorong
        if: env.lewati != '1' && steps.versi.outputs.jenis != 'lewati'
        run: |
          baru="${{ steps.versi.outputs.baru }}"
          npm version "${{ steps.versi.outputs.jenis }}" --no-git-tag-version >/dev/null
          [ "$(node -p "require('./package.json').version")" = "$baru" ]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Rilis v$baru"
          git tag -a "v$baru" -m "v$baru"
          git push origin HEAD:main
          git push origin "v$baru"

      - name: Buat GitHub release
        if: env.lewati != '1' && steps.versi.outputs.jenis != 'lewati'
        run: |
          gh release create "v${{ steps.versi.outputs.baru }}" \
            --verify-tag \
            --title "v${{ steps.versi.outputs.baru }}" \
            --generate-notes || \
          gh release create "v${{ steps.versi.outputs.baru }}" \
            --verify-tag \
            --title "v${{ steps.versi.outputs.baru }}"

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Rilis otomatis"
            if [ "${lewati:-}" = "1" ]; then echo "- Dilewati: ada commit yang lebih baru di main."
            elif [ "${{ steps.versi.outputs.jenis }}" = "lewati" ]; then echo "- Dilewati: ${{ steps.versi.outputs.alasan }}."
            else echo "- v${{ steps.versi.outputs.lama }} → **v${{ steps.versi.outputs.baru }}** (${{ steps.versi.outputs.jenis }}, ${{ steps.versi.outputs.alasan }})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
