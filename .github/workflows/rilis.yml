name: Rilis

# Dijalankan manual dari tab Actions → Rilis → Run workflow.
# Menaikkan versi package.json, membuat commit "Rilis vX.Y.Z", tag, dan GitHub release dengan catatan otomatis
# (daftar PR yang digabung sejak rilis sebelumnya).
on:
  workflow_dispatch:
    inputs:
      jenis:
        description: 'Jenis kenaikan versi (patch = perbaikan, minor = fitur baru, major = perubahan yang merusak)'
        type: choice
        options: [patch, minor, major]
        default: minor
      uji_coba:
        description: 'Uji coba: hitung versi dan tampilkan, tanpa commit, tag, atau release'
        type: boolean
        default: false

concurrency:
  group: rilis
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  rilis:
    name: Rilis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Rilis hanya dari main.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pastikan CI commit ini lulus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hasil=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion,status --jq '[.[] | select(.status=="completed")] | map(.conclusion) | if length==0 then "belum-ada" elif all(.=="success") then "success" else "gagal" end')
          echo "Status CI untuk $GITHUB_SHA: $hasil"
          if [ "$hasil" != "success" ]; then
            echo "::error::CI commit ini belum lulus ($hasil). Tunggu CI hijau, lalu jalankan ulang."
            exit 1
          fi

      - name: Hitung versi baru
        id: versi
        run: |
          lama=$(node -p "require('./package.json').version")
          npm version "${{ inputs.jenis }}" --no-git-tag-version >/dev/null
          baru=$(node -p "require('./package.json').version")
          if git rev-parse "v$baru" >/dev/null 2>&1; then
            echo "::error::Tag v$baru sudah ada."
            exit 1
          fi
          echo "lama=$lama" >> "$GITHUB_OUTPUT"
          echo "baru=$baru" >> "$GITHUB_OUTPUT"
          echo "### Rilis: v$lama → v$baru (${{ inputs.jenis }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Uji coba selesai
        if: ${{ inputs.uji_coba }}
        run: |
          echo "Uji coba, tidak ada commit, tag, atau release yang dibuat. Versi berikutnya v${{ steps.versi.outputs.baru }}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag, dan dorong
        if: ${{ !inputs.uji_coba }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Rilis v${{ steps.versi.outputs.baru }}"
          git tag -a "v${{ steps.versi.outputs.baru }}" -m "v${{ steps.versi.outputs.baru }}"
          git push origin HEAD:main
          git push origin "v${{ steps.versi.outputs.baru }}"

      - name: Buat GitHub release
        if: ${{ !inputs.uji_coba }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.versi.outputs.baru }}" \
            --verify-tag \
            --title "v${{ steps.versi.outputs.baru }}" \
            --generate-notes \
            --notes-start-tag "v${{ steps.versi.outputs.lama }}"
