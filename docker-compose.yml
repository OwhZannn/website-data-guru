services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Menimpa DATABASE_URL di .env: jalur absolut di dalam kontainer.
      DATABASE_URL: file:/app/data/prod.db
    volumes:
      - ./data:/app/data
    ports:
      # Hanya 127.0.0.1: aplikasi dapat dicapai lewat nginx saja.
      - "127.0.0.1:${PORT_WEB:-3000}:3000"
    healthcheck:
      # /api/hidup tidak menyentuh Drive maupun basis data; /api/kesehatan butuh sesi admin.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/hidup"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
